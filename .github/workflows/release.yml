name: Release ZMK Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Configuration
        uses: actions/checkout@v4
        with:
          path: config
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            git cmake ninja-build \
            gcc-arm-none-eabi \
            device-tree-compiler \
            dfu-util

      - name: Setup Python Environment
        run: |
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip
          pip install west

      - name: Cache Zephyr SDK
        uses: actions/cache@v3
        with:
          path: ~/.local/share/west/zmk
          key: ${{ runner.os }}-zmk-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize West Workspace
        run: |
          source ~/.venv/bin/activate
          mkdir -p zmk
          cd zmk
          git init
          git remote add origin https://github.com/zmkfirmware/zmk.git
          git fetch --depth=1 origin main
          git checkout main
          git submodule update --init --recursive
          cd ..
          west init -l config
          west update

      - name: Copy Config to ZMK
        run: |
          source ~/.venv/bin/activate
          # Copy board configuration to ZMK
          cp -r config/boards zmk/app/boards
          cp -r config/zephyr zmk/zephyr

      - name: Build Left Half
        run: |
          source ~/.venv/bin/activate
          cd zmk
          west build -b lotus58_ble_left -- -DCONFIG_ZMK_USB=y
          cd ..

      - name: Build Right Half
        run: |
          source ~/.venv/bin/activate
          cd zmk
          west build -b lotus58_ble_right -- -DCONFIG_ZMK_USB=y
          cd ..

      - name: Collect and Rename Artifacts
        run: |
          mkdir -p release
          # Left half
          cp zmk/build/zephyr/lotus58_ble_left.uf2 release/lotus58_ble_left-${GITHUB_REF_NAME}.uf2
          cp zmk/build/zephyr/lotus58_ble_left.hex release/lotus58_ble_left-${GITHUB_REF_NAME}.hex
          # Right half
          cp zmk/build/zephyr/lotus58_ble_right.uf2 release/lotus58_ble_right-${GITHUB_REF_NAME}.uf2
          cp zmk/build/zephyr/lotus58_ble_right.hex release/lotus58_ble_right-${GITHUB_REF_NAME}.hex
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware-release-${{ github.ref_name }}
          path: release/

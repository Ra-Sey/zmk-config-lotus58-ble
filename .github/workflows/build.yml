name: Build ZMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Configuration
        uses: actions/checkout@v4
        with:
          path: config
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            git cmake ninja-build \
            gcc-arm-none-eabi \
            device-tree-compiler \
            dfu-util

      - name: Setup Python Environment
        run: |
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip
          pip install west

      - name: Cache Zephyr SDK
        uses: actions/cache@v3
        with:
          path: ~/.local/share/west/zmk
          key: ${{ runner.os }}-zmk-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize West Workspace
        run: |
          source ~/.venv/bin/activate
          mkdir -p zmk
          cd zmk
          git init
          git remote add origin https://github.com/zmkfirmware/zmk.git
          git fetch --depth=1 origin main
          git checkout main
          git submodule update --init --recursive
          cd ..
          west init -l config
          west update

      - name: Build Left Half
        run: |
          source ~/.venv/bin/activate
          west build -b lotus58_ble_left -- -DCONFIG_ZMK_USB=y

      - name: Build Right Half
        run: |
          source ~/.venv/bin/activate
          west build -b lotus58_ble_right -- -DCONFIG_ZMK_USB=y

      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          find build -name "*.uf2" -exec cp {} artifacts/ \;
          find build -name "*.hex" -exec cp {} artifacts/ \;
          find build -name "*.bin" -exec cp {} artifacts/ \;
          ls -la artifacts/


      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware-lotus58_ble
          path: artifacts/
          if-no-files-found: error
